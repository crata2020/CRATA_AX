    description: "직원 본인 OAuth로만 메일을 읽어 거래처·프로젝트에 분류하고 후속 업무를 제안한다. 본문은 기본 저장하지 않고 메타데이터와 링크만. 본인이 '프로젝트에 공유'한 메일만 다른 사람에게 보인다. 메일 앱은 만들지 않는다"
