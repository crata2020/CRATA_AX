        fields: [id, partner_id, name, dept, title, email, phone, is_primary]
    permissions: { owner: manage, admin: manage, reviewer: edit, member: view }
    permission_notes: "담당자 연락처는 개인정보(L1). 내보내기는 owner·admin만"
    integrations: ["더존 등 ERP 거래처", "CRM"]
    depends_on: [business-structure]

  - id: calendar
    name_ko: "일정"
    tier: P1
    group: company
    icon: CalendarOutlined
    route: "/company/calendar"
    industry: core
    default_enabled: true
    build_mode: hybrid
    crata_module: null
