        fields: [member_id, week_start, regular_hours, overtime_hours, source, synced_at]
      - name: LeaveBalance
        label_ko: "연차 잔여"
        fields: [member_id, year, granted_days, used_days, remaining_days, source, synced_at]
    permissions: { owner: view, admin: view, reviewer: view, member: own }
    permission_notes: "reviewer는 팀원의 '오늘 근무·휴가 상태'만(사유·시간 상세는 제외). 근로시간 상세는 owner·admin과 본인"
    integrations: ["다우오피스 근태·휴가", "하이웍스 근무관리", "네이버웍스 근태", "카카오워크 근태관리", "근태 전문 SaaS"]
    depends_on: [integrations, org-members]

  - id: knowledge
    name_ko: "지식"
    tier: P1
    group: docs
    icon: BookOutlined
    route: "/docs/knowledge"
    industry: core
    default_enabled: true
    build_mode: hybrid
    crata_module: "6"
    description: "결정 이력, 규정·매뉴얼, FAQ, 용어집, 참고 자료를 서로 잇고 검증 주기(검증일·재검토일)를 관리한다. 본문은 Notion·Drive·위키에 두고 링크한다. 지식 엔진·위키 에디터는 만들지 않는다"
    entities:
      - name: KnowledgeItem
        label_ko: "지식 항목"
        fields: [id, kind, title, summary, body_ref, project_id, owner_id, source_ref, verified_at, review_by, status]
      - name: KnowledgeLink
        label_ko: "지식 연결"
        fields: [from_type, from_id, to_type, to_id, relation]
    permissions: { owner: manage, admin: manage, reviewer: approve, member: edit }
    permission_notes: "member는 초안 작성. reviewer가 '검증됨'으로 확정. 용어(GlossaryTerm)는 admin-settings와 같은 데이터를 쓴다"
    integrations: ["Notion", "Google Drive", "Confluence", "티로 Wiki"]
    depends_on: [business-structure, meetings, documents]

  - id: correction-rules
    name_ko: "작성 규칙(수정에서 배운 규칙)"
    tier: P1
    group: docs
    icon: DiffOutlined
    route: "/docs/rules"
    industry: core
    default_enabled: true
    build_mode: build
