# CRATA 업무사이트 모듈 레지스트리 v0.1 (초안, 2026-10-02)
# 설계 문서(정본): docs/worksite/02_common-modules.md
# 쓰임
#  - 업무사이트 뼈대(Refine + Ant Design)가 이 파일을 읽어 메뉴, 라우트, 권한 기본값, 홈 위젯 카탈로그를 만든다.
#  - 고객사별 켜기·끄기, 메뉴 이름 바꾸기, 위젯 배치는 clients/{slug}/company_profile.yaml(portal_hints)에서 덮어쓴다.
#    고객사 때문에 이 파일을 고치지 않는다. 이 파일은 "모든 회사에 공통인 목록"이다.
# 규칙
#  - id는 kebab-case. 한 번 정한 id는 바꾸지 않는다(라우트·권한·감사 로그가 id를 참조).
#  - icon은 @ant-design/icons 5.6.1에 실제로 있는 이름만 쓴다(2026-10-02 패키지 파일로 존재 확인).
#  - entities.fields는 "핵심 필드"만 적는다. 실제 DB 스키마는 생성기가 이 목록과 Company DNA(ontology)를 합쳐 만든다.
#  - 실존 인물 이름, 고객사 비공개 정보는 넣지 않는다. 데모 데이터는 가상의 이름만 쓴다.
#  - 데이터 등급 L0~L3의 정의 정본은 docs/research/04_data-governance.md. L3는 어떤 모듈에도 저장하지 않는다.
#    ARA 복지의 개인 데이터는 'P 영역'(docs/research/00_direction.md 6장)으로, 회사 업무 DB와 분리한다.

meta:
  version: "0.1"
  updated: "2026-10-02"
  status: draft
  owner: "TODO: 레지스트리 관리자 1명(CRATA)"
  doc: "docs/worksite/02_common-modules.md"
  changelog:
    - "0.1 (2026-10-02): 첫 초안. 공통 코어 31개(P0 14 · P1 11 · P2 6), 제조업 팩 6개, 교육·컨설팅 팩 2개, 홈 위젯 26개, 만들지 않는 것 9개"

tiers:
  P0: "지금 뼈대에 있어야 함. 화면·데이터 모델·권한이 데모 데이터로 동작"
  P1: "다음 단계. 첫 고객 진단(2~4주) 뒤 파일럿 2~3개월 안에"
  P2: "나중. 고객 요청이나 계약 조건에 따라"

roles:
  owner:
    name_ko: "소유자(대표)"
    desc: "계약·결제 주체. 회사 정책(AI 연결, 데이터 등급, 업종 팩)과 소유자 지정. 보통 대표이사 1~2명"
    home_preset: ceo
  admin:
    name_ko: "관리자"
    desc: "구성원 초대·역할, 연동, 회사 설정, 감사 로그 조회. 보통 총무·경영지원 담당"
    home_preset: staff_admin
  reviewer:
    name_ko: "검토자(팀장)"
    desc: "업무 생성·배정, 제출물 승인·반려, 회의 결정 확정, 담당 문서 유형의 규칙 승인. 보통 팀장·공장장"
    home_preset: lead
  member:
    name_ko: "구성원(실무자)"
    desc: "내 업무 진행·제출, 참여 프로젝트 조회, 산출물 작성, 본인 AI 연결"
    home_preset: staff

platform_roles:
  crata_operator:
    name_ko: "CRATA 운영자"
    desc: "테넌트 밖의 역할. Company DNA 프로파일 적용, 모듈 켜기·끄기, 장애 대응. 고객 데이터 열람은 고객 승인 + 기간 한정 + 감사 로그 기록(actor_type=crata_operator)"

permission_levels:
  manage: "설정·삭제를 포함한 전체 관리"
  approve: "작성·수정 + 승인·반려·확정"
  edit: "작성·수정(권한 범위 안)"
  own: "본인 것만 작성·조회"
  view: "조회만(권한 범위 안)"
  aggregate: "집계만. 개인을 알아볼 수 없는 형태"
  none: "접근 불가"

build_modes:
  build: "CRATA가 직접 만든다"
  integrate: "기존 도구에 연결만 한다(읽기 우선). 원본은 기존 도구에 남는다"
  hybrid: "가벼운 자체 화면 + 기존 도구 연동. 고객이 해당 도구를 쓰면 연동이 우선"

industries:
  core: "모든 회사 공통"
  manufacturing: "제조업 팩. 첫 적용 고객: (주)티알테크놀러지(경남 양산, 자동차 부품 편조 메시)"
  education_consulting: "교육·컨설팅 팩. CRATA 자신(내부 적용)과 유사 고객"

crata_modules:   # docs/research/00_direction.md 5장 모듈 지도
  "1": "진단·설정(Company DNA Profile)"
  "2": "회의"
  "3": "업무·배분"
  "4": "산출물·수정 학습"
  "5": "메일 커넥터"
  "6": "지식 연결"
  "7": "ARA MCP(각자의 AI 연결)"
  "8": "ARA 복지"

# ───────────────────────── 내비게이션 그룹 (데스크톱 좌측 메뉴, 최상위 9개 이하)
nav_groups:
  - { id: home,     order: 1, name_ko: "홈",        icon: HomeOutlined,        route: "/",          visible_to: [owner, admin, reviewer, member] }
  - { id: work,     order: 2, name_ko: "내 업무",   icon: CheckSquareOutlined, route: "/work",      visible_to: [owner, admin, reviewer, member] }
  - { id: projects, order: 3, name_ko: "프로젝트",  icon: ProjectOutlined,     route: "/projects",  visible_to: [owner, admin, reviewer, member] }
  - { id: meetings, order: 4, name_ko: "회의",      icon: TeamOutlined,        route: "/meetings",  visible_to: [owner, admin, reviewer, member] }
  - { id: docs,     order: 5, name_ko: "문서·지식", icon: FileTextOutlined,    route: "/docs",      visible_to: [owner, admin, reviewer, member] }
  - id: industry
    order: 6
    name_ko: "(업종 팩 이름)"
    name_by_pack: { manufacturing: "생산·품질", education_consulting: "영업·교육" }
    icon: BuildOutlined
    route: "/ops"
    visible_to: [owner, admin, reviewer, member]
    visible_when: "업종 팩이 1개 이상 켜졌을 때만. 팩이 없으면 메뉴에서 빠진다"
  - { id: company,  order: 7, name_ko: "회사",      icon: BankOutlined,        route: "/company",   visible_to: [owner, admin, reviewer, member] }
  - id: ara
    order: 8
    name_ko: "ARA"
    icon: HeartOutlined
    route: "/ara"
    visible_to: [owner, admin, reviewer, member]
    note: "개인 영역. 다른 메뉴와 구분선으로 나누고 '나만 보는 공간' 표시. 관리자도 남의 ARA 화면에 들어갈 수 없다"
  - { id: admin,    order: 9, name_ko: "관리",      icon: SettingOutlined,     route: "/admin",     visible_to: [owner, admin] }
  - id: topbar
    order: null
    name_ko: "상단 바"
    note: "좌측 메뉴에 넣지 않는 것: 검색(Ctrl/Cmd+K), 알림, 도움말, 프로필 메뉴(내 정보·내 AI 연결·알림 설정·로그아웃)"

# ───────────────────────── 모바일 하단 탭 (5개)
mobile_tabs:
  default:
    - { id: home,          name_ko: "홈",      icon: HomeOutlined,        route: "/" }
    - { id: work,          name_ko: "내 업무", icon: CheckSquareOutlined, route: "/work",          note: "검토자는 '검토 대기' 배지 표시" }
    - { id: meetings,      name_ko: "회의",    icon: TeamOutlined,        route: "/meetings" }
    - { id: notifications, name_ko: "알림",    icon: BellOutlined,        route: "/notifications" }
    - { id: more,          name_ko: "전체",    icon: AppstoreOutlined,    route: "/more",          note: "전체 메뉴 시트. ARA·회사·문서·관리 진입" }
  manufacturing:   # 제조업 팩이 켜진 회사. 회의 탭 자리에 현장 등록을 둔다(회의는 '전체'에서 진입)
    - { id: home,          name_ko: "홈",        icon: HomeOutlined,        route: "/" }
    - { id: work,          name_ko: "내 업무",   icon: CheckSquareOutlined, route: "/work" }
    - { id: field-report,  name_ko: "현장 등록", icon: PlusCircleOutlined,  route: "/ops/report", note: "불량·설비 이상·아차사고를 사진 1장 + 한 줄로 등록" }
    - { id: notifications, name_ko: "알림",      icon: BellOutlined,        route: "/notifications" }
    - { id: more,          name_ko: "전체",      icon: AppstoreOutlined,    route: "/more" }

# ───────────────────────── 모듈
modules:

  # ======================= P0: 공통 코어 (뼈대에 지금 있어야 함) =======================

  - id: home-dashboard
    name_ko: "홈 대시보드"
    tier: P0
    group: home
    icon: HomeOutlined
    route: "/"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: null
    description: "역할별 기본 위젯 묶음(대표·팀장·실무자)을 보여 주는 첫 화면. 회사 기본 배치는 Company DNA(portal_hints.home_widgets, kpis)에서 만든다"
    entities:
      - name: DashboardLayout
        label_ko: "대시보드 배치"
        fields: [id, tenant_id, preset, member_id, widgets, updated_at]
    permissions: { owner: manage, admin: manage, reviewer: own, member: own }
    permission_notes: "owner·admin은 회사 기본 배치를 정한다. 개인은 위젯 순서·숨김만 바꾼다(member_id가 있는 배치)"
    depends_on: []

  - id: org-members
    name_ko: "구성원·조직도"
    tier: P0
    group: company
    icon: ContactsOutlined
    route: "/company/people"
    industry: core
    default_enabled: true
    build_mode: hybrid
    crata_module: "1"
    description: "사람 찾기(이름·소속·담당 업무·연락처)와 조직도. 그룹웨어·HR 시스템이 있으면 동기화하고, 없으면 직접 입력. 근로자명부·인사기록(주민번호·주소·급여)은 저장하지 않는다"
    entities:
      - name: OrgUnit
        label_ko: "조직"
        fields: [id, name, parent_id, head_member_id, sort_order, valid_from, valid_to]
      - name: Member
        label_ko: "구성원"
        fields: [id, tenant_id, display_name, email, phone_work, org_unit_id, position, job_title, duties, role, status, joined_at, avatar_ref, external_ids]
    permissions: { owner: manage, admin: manage, reviewer: view, member: view }
    permission_notes: "본인 프로필(사진·업무 연락처·담당 업무 소개)은 본인이 수정. role 변경은 admin-members에서만"
    integrations: ["하이웍스 조직·구성원 API", "네이버웍스 구성원", "다우오피스 조직도", "Google Workspace·M365 디렉터리"]
    depends_on: []

  - id: company-info
    name_ko: "회사 소개"
    tier: P0
    group: company
    icon: InfoCircleOutlined
    route: "/company/about"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: "1"
    description: "비전·방침·연혁·인증·대표 연락처를 한 화면에. Company DNA L1(정체성) 값을 그대로 보여 준다. 공개 정보 위주"
    entities:
      - name: CompanyInfo
        label_ko: "회사 정보"
        fields: [tenant_id, legal_name, display_name, address, phone, website, founded_on, vision, values, policies, history, certifications, logo_ref, updated_at]
    permissions: { owner: manage, admin: manage, reviewer: view, member: view }
    depends_on: []

  - id: business-structure
    name_ko: "사업·프로젝트·파트"
    tier: P0
    group: projects
    icon: PartitionOutlined
    route: "/projects"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: "1"
    description: "모든 것의 뼈대. 사업 > 프로젝트 > 파트 계층에 업무·회의·문서·메일·결정이 붙는다. 회의 분류 체계(config/meeting_taxonomy.yaml)와 같은 코드를 쓴다"
    entities:
      - name: BusinessLine
        label_ko: "사업"
        fields: [id, code, name, description, owner_member_id, status, sort_order]
      - name: Project
        label_ko: "프로젝트"
        fields: [id, business_line_id, code, name, aliases, partner_id, owner_member_id, reviewer_member_id, start_on, due_on, status, health, sensitivity, description]
      - name: Part
        label_ko: "파트"
        fields: [id, project_id, name, lead_member_id, member_ids, sort_order]
    permissions: { owner: manage, admin: manage, reviewer: edit, member: view }
    permission_notes: "reviewer는 자기가 owner·reviewer인 사업·프로젝트만 수정. member는 참여 프로젝트만 조회하고, sensitivity=L2 프로젝트는 참여자만 본다"
    depends_on: [org-members]

  - id: tasks
    name_ko: "업무·배분·검토"
    tier: P0
    group: work
    icon: CheckSquareOutlined
    route: "/work"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: "3"
    description: "내 업무, 팀 배분, 제출과 검토. 각자의 AI(MCP)는 '제출'까지만 하고 '완료'는 검토자가 웹에서 한다. 배분 규칙은 Company DNA L5·L7에서 온다"
    entities:
      - name: Task
        label_ko: "업무"
        fields: [id, project_id, part_id, title, description, task_type, assignee_id, reviewer_id, due_at, priority, status, source, source_ref, estimate_hours, sensitivity, created_by, created_at]
      - name: ProgressLog
        label_ko: "진행 기록"
        fields: [id, task_id, author_id, body, via, created_at]
      - name: Submission
        label_ko: "제출"
        fields: [id, task_id, version, artifact_id, summary, submitted_by, via, idempotency_key, status, review_comment, reviewed_by, reviewed_at]
      - name: AssignmentRule
        label_ko: "배분 규칙"
        fields: [id, name, condition, assignee_rule, reviewer_rule, source_ref, active]
    permissions: { owner: manage, admin: manage, reviewer: approve, member: own }
    permission_notes: "member는 본인 업무의 진행 기록·제출만. reviewer는 담당 범위 업무 생성·배정·승인·반려. 진행 기록은 추가만 가능(수정·삭제 없음)"
    depends_on: [business-structure, org-members, notifications, audit-log]

  - id: meetings
    name_ko: "회의"
    tier: P0
    group: meetings
    icon: TeamOutlined
    route: "/meetings"
    industry: core
    default_enabled: true
    build_mode: hybrid
    crata_module: "2"
    description: "녹음·전사는 Plaud·클로바노트·티로 등에 맡기고, 구간 분류·결정·액션 제안과 프로젝트 연결만 한다. 원음은 저장하지 않고 링크만 둔다. 액션은 제안 카드 → 1클릭 승인으로 업무가 된다"
    entities:
      - name: Meeting
        label_ko: "회의"
        fields: [id, title, title_prefix, meeting_type, project_ids, started_at, duration_min, attendee_ids, source, transcript_ref, summary, sensitivity, status]
      - name: MeetingSegment
        label_ko: "회의 구간"
        fields: [id, meeting_id, start_ts, end_ts, business_line_code, project_code, task_type, confidence, evidence_quote, review_status]
      - name: Decision
        label_ko: "결정"
        fields: [id, meeting_id, project_id, statement, decided_by_role, decided_at, supersedes_id, status]
      - name: ActionProposal
        label_ko: "액션 제안"
        fields: [id, meeting_id, segment_id, title, suggested_assignee_id, suggested_due_at, status, task_id]
    permissions: { owner: manage, admin: manage, reviewer: approve, member: view }
    permission_notes: "member는 참석했거나 공개 범위에 든 회의만 조회하고, 본인이 올린 회의는 수정. reviewer가 분류·결정·액션을 확정"
    integrations: ["Plaud MCP·CLI(읽기)", "Zapier(Plaud 트리거)", "클로바노트(네이버웍스)", "티로 API·MCP"]
    depends_on: [business-structure, tasks]

  - id: documents
    name_ko: "산출물·양식"
    tier: P0
    group: docs
    icon: FileTextOutlined
    route: "/docs"
    industry: core
    default_enabled: true
    build_mode: hybrid
    crata_module: "4"
    description: "산출물의 버전(AI 초안 → 수정 → 최종)과 회사 양식 목록. 파일 본체는 고객 저장소(Drive·SharePoint·NAS)에 두고, 메타데이터·버전·적용 규칙만 관리한다. AI 초안에는 AI 생성 표시를 붙인다"
    entities:
      - name: Artifact
        label_ko: "산출물"
        fields: [id, project_id, task_id, doc_type, template_id, title, current_version, file_ref, ai_generated, sensitivity, owner_id, status]
      - name: ArtifactVersion
        label_ko: "산출물 버전"
        fields: [id, artifact_id, ver, kind, file_ref, author_id, created_at, applied_rule_ids]
      - name: Template
        label_ko: "양식"
        fields: [id, doc_type, name, format, version, file_ref, owner_id, status]
    permissions: { owner: manage, admin: manage, reviewer: approve, member: edit }
    permission_notes: "member는 본인·참여 프로젝트 산출물 작성. reviewer가 최종본 확정과 양식 게시"
    integrations: ["Google Drive", "SharePoint·OneDrive", "네이버웍스 드라이브", "사내 NAS(링크)"]
    depends_on: [business-structure, tasks]

  - id: notices
    name_ko: "공지·게시판"
    tier: P0
    group: company
    icon: NotificationOutlined
    route: "/company/notices"
    industry: core
    default_enabled: true
    build_mode: hybrid
    crata_module: null
    description: "회사 공지, 규정 변경 안내, 행사, 안전 공지. 필독 공지는 열람 확인을 남긴다. 그룹웨어 게시판이 있으면 그 글을 함께 보여 주는 연동은 P1"
    entities:
      - name: Notice
        label_ko: "공지"
        fields: [id, category, title, body, author_id, audience, pinned, must_read, published_at, expires_at, attachments]
      - name: ReadReceipt
        label_ko: "열람 확인"
        fields: [notice_id, member_id, read_at]
    permissions: { owner: manage, admin: manage, reviewer: edit, member: view }
    permission_notes: "reviewer는 본인 조직·프로젝트 대상 공지만 작성"
    depends_on: [org-members, notifications]

  - id: notifications
    name_ko: "알림"
    tier: P0
    group: topbar
    icon: BellOutlined
    route: "/notifications"
    industry: core
    default_enabled: true
    build_mode: hybrid
    crata_module: null
    description: "사이트 안 알림함 + 알림 설정(즉시·하루 2회 묶음·하루 1회, 업무시간 외 조용히). 메신저 봇(카카오워크·네이버웍스·잔디·Slack)과 메일 발송 연동은 P1"
    entities:
      - name: Notification
        label_ko: "알림"
        fields: [id, recipient_id, kind, title, body, link, source_module, source_id, channel, batched_at, read_at, created_at]
      - name: NotificationPreference
        label_ko: "알림 설정"
        fields: [member_id, kind, channels, digest, quiet_hours]
    permissions: { owner: manage, admin: manage, reviewer: own, member: own }
    permission_notes: "owner·admin은 회사 기본값(묶음 주기·조용한 시간)을 정하고, 개인은 자기 설정만 바꾼다"
    depends_on: []

  - id: search
    name_ko: "검색"
    tier: P0
    group: topbar
    icon: SearchOutlined
    route: "/search"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: null
    description: "사이트 안 검색(Ctrl/Cmd+K): 사람 → 프로젝트 → 업무 → 회의 → 문서·지식 순. 사람 결과는 사진·이름·소속·연락처를 바로 보여 준다. 외부 도구 전체를 뒤지는 사내 통합검색은 만들지 않는다"
    entities:
      - name: SearchIndexEntry
        label_ko: "검색 색인"
        fields: [id, tenant_id, object_type, object_id, title, snippet, acl_principals, sensitivity, updated_at]
    permissions: { owner: view, admin: view, reviewer: view, member: view }
    permission_notes: "결과는 항상 요청자의 권한으로 거른다(acl_principals). L2는 참여자에게만"
    depends_on: [org-members, business-structure]

  - id: ai-connect
    name_ko: "내 AI 연결"
    tier: P0
    group: topbar
    icon: ApiOutlined
    route: "/me/ai"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: "7"
    description: "직원 각자의 ChatGPT·Claude·Codex를 OAuth로 연결해 내 업무 조회·진행 기록·제출을 하게 한다(도구 6개). 개인 화면은 프로필 메뉴에, 회사 정책(끄기·읽기 전용·허용 클라이언트)은 관리 > AI 연결 정책(/admin/ai-policy)에 둔다. 연결 전 국외이전 고지"
    entities:
      - name: McpConnection
        label_ko: "AI 연결"
        fields: [id, member_id, client_name, client_id, scopes, created_at, last_used_at, revoked_at]
      - name: McpPolicy
        label_ko: "AI 연결 정책"
        fields: [tenant_id, enabled, read_only, allowed_clients, allowed_scopes, overseas_notice_version, updated_by, updated_at]
    permissions: { owner: manage, admin: manage, reviewer: own, member: own }
    permission_notes: "개인은 본인 연결만 만들고 끊는다. owner·admin은 정책과 전체 세션 철회만 하고, 남의 AI 대화 내용은 볼 수 없다(애초에 저장하지 않음)"
    depends_on: [tasks, audit-log]

  - id: admin-members
    name_ko: "구성원·권한 관리"
    tier: P0
    group: admin
    icon: UserSwitchOutlined
    route: "/admin/members"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: "1"
    description: "초대, 역할 부여(owner·admin·reviewer·member), 범위 권한(사업·프로젝트 단위), 직책 → 역할 기본 매핑. 퇴사자는 비활성화(삭제 대신)"
    entities:
      - name: Invitation
        label_ko: "초대"
        fields: [id, email, role, org_unit_id, invited_by, expires_at, status]
      - name: RoleAssignment
        label_ko: "역할 부여"
        fields: [member_id, role, scope_type, scope_id, granted_by, granted_at]
      - name: PositionRoleMap
        label_ko: "직책-역할 매핑"
        fields: [position_or_title, default_role]
    permissions: { owner: manage, admin: manage, reviewer: none, member: none }
    permission_notes: "owner 지정·해제는 owner만 한다. 모든 변경은 감사 로그에 남는다"
    integrations: ["SSO(SAML·OIDC)와 SCIM 자동 동기화는 P2 이후 검토"]
    depends_on: [org-members, audit-log]

  - id: admin-settings
    name_ko: "회사 설정"
    tier: P0
    group: admin
    icon: SettingOutlined
    route: "/admin/settings"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: "1"
    description: "Company DNA Profile이 적용된 결과를 보는 화면: 브랜드 색·로고, 용어(메뉴·필드 이름), 켜진 모듈·업종 팩, 데이터 등급 기본값. 프로파일 원본 수정은 CRATA 운영자가 차이(diff)로 하고, 고객은 브랜드·라벨·알림 기본값 정도만 직접 바꾼다"
    entities:
      - name: TenantSettings
        label_ko: "회사 설정"
        fields: [tenant_id, display_name, brand_tokens, logo_ref, locale, timezone, enabled_modules, enabled_packs, nav_overrides, data_class_defaults, profile_version]
      - name: GlossaryTerm
        label_ko: "용어"
        fields: [id, term, ui_label, aliases, forbidden, definition]
    permissions: { owner: manage, admin: manage, reviewer: none, member: none }
    permission_notes: "업종 팩 추가·삭제와 데이터 등급 기본값은 계약 사항이라 owner + CRATA 운영자가 함께 바꾼다"
    depends_on: []

  - id: audit-log
    name_ko: "감사 로그"
    tier: P0
    group: admin
    icon: HistoryOutlined
    route: "/admin/audit"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: null
    description: "누가(사람·AI 연결·시스템·CRATA 운영자) 언제 무엇을 바꿨는지 추가만 가능한 기록. 개인정보 접속기록 요건(최소 1년)을 고려해 기본 보관 2년(제안). 변경 내용은 마스킹해서 남긴다"
    entities:
      - name: AuditEvent
        label_ko: "감사 이벤트"
        fields: [id, tenant_id, at, actor_id, actor_type, action, resource, resource_id, changes, ip, user_agent, request_id]
    permissions: { owner: view, admin: view, reviewer: none, member: own }
    permission_notes: "member는 '내 계정과 내 AI 연결이 한 일'만 본다. 아무도 수정·삭제할 수 없다"
    depends_on: []

  # ======================= P1: 공통 코어 (다음 단계) =======================

  - id: partners
