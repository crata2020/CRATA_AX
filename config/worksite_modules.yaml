    permissions: { owner: manage, admin: manage, reviewer: approve, member: view }
    permission_notes: "member는 규칙 조회와 본인 수정의 사유 입력. reviewer는 담당 문서 유형의 규칙 후보를 승인·반려"
    depends_on: [documents]

  - id: mail-connector
