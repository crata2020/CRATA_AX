# ───────────────────────── 홈 위젯 카탈로그
# suitable_for: 이 위젯이 맞는 프리셋(사용자가 직접 추가할 수 있는 범위). 기본으로 깔리는 배치는 아래 home_presets가 정한다
# 프리셋: ceo(대표) · lead(팀장) · staff(실무자) · staff_admin(관리자 = 실무자 + 운영 점검)
# 역할(role)과 직책은 다르다. 공장장이 reviewer여도 ceo 프리셋을 고를 수 있다(개인별 선택).
home_widgets:
  - { id: greeting,             name_ko: "인사·오늘",            tier: P0, module: home-dashboard, suitable_for: [ceo, lead, staff, staff_admin], data: "이름, 날짜, 오늘 회의 수, 마감 임박 업무 수, (연동 시) 근무 상태" }
