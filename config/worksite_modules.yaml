    depends_on: [integrations]

  - id: attendance-leave
    name_ko: "근태·휴가(연동)"
    tier: P1
    group: company
    icon: FieldTimeOutlined
    route: "/company/attendance"
    industry: core
    default_enabled: false
    build_mode: integrate
    crata_module: null
    description: "근태 시스템의 요약만 읽어 온다: 오늘 근무·휴가 상태, 내 잔여 연차, 주간 근로시간(52시간 한도 접근 경고). 출퇴근 기록·연차 계산·사용 촉진은 전문 시스템이 한다"
    entities:
      - name: AttendanceSummary
        label_ko: "근태 요약"
        fields: [member_id, date, status, source, synced_at]
      - name: WorkHoursWeekly
