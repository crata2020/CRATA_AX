  - id: ara-wellbeing
    name_ko: "ARA 복지"
    tier: P1
    group: ara
    icon: HeartOutlined
    route: "/ara"
    industry: core
    default_enabled: true
    build_mode: build
    crata_module: "8"
    description: "성향 진단·일하는 방식 카드·코칭. 개인 데이터는 P 영역(별도 DB·직원별 암호화)에 두고 회사·관리자는 접근할 수 없다. 회사에는 본인이 고른 카드 문장 사본과 10명 이상 집계만. P0 뼈대에는 메뉴 자리와 '회사가 보는 것 / 못 보는 것' 안내 화면만 둔다"
