    - { term: "Pressing 가공", variants: ["프레싱", "압축 성형"], definition: "편조망을 프레스로 압축 성형하는 가공", ui_label: "프레스 성형", stt_boost: true, goal_a_keyword: false, status: stated, evidence: ["WEB-TR-05"] }
    - { term: "Spiralling 가공", variants: ["스파이럴링"], definition: "편조망을 나선형으로 감는 가공(공개 공정명)", ui_label: "스파이럴링", stt_boost: true, goal_a_keyword: false, status: stated, evidence: ["WEB-TR-05"] }
    - { term: "전용기", variants: [], definition: "TODO: 용도 확인", ui_label: "전용기", stt_boost: false, goal_a_keyword: false, status: stated, evidence: ["WEB-TR-05"] }
