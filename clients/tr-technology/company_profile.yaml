    - { term: "편조 장치", variants: ["Knitting Machine", "편조기"], definition: "편조망을 짜는 설비", ui_label: "편조기", stt_boost: true, goal_a_keyword: false, status: stated, evidence: ["WEB-TR-05"], note: "화면 표기 '편조기'는 제안. 사내 호칭 확인 TODO" }
    - { term: "편조 금형", variants: [], definition: "편조 장치에 쓰는 금형(회사소개서 공정 그림)", ui_label: "편조 금형", stt_boost: true, goal_a_keyword: false, status: stated, evidence: ["PUB-TR-INTRO-KO#p10"] }
