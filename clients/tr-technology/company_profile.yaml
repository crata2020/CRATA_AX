# 레이어 L6. 업무 객체 온톨로지 — 제조 팩 표준(03 문서 5장)을 출발점으로, TR 확인 전 초안
ontology:
  store: { engine: "postgres", location: "supabase-seoul" }
  graph_memory: { enabled: false }
  excluded_l3: []
  source: "config/worksite_modules.yaml mfg-* + docs/worksite/03_tr-technology.md 5장"
  objects:
    - id: Item
      ui_label: "품목"
      sensitivity: L1
      kinds: ["원자재(선재)", "편조망·편조 롤", "편조 부품(완제품)"]
      properties_tr:
        - { name: material_grade, type: "enum[304,316,321,310S,Copper,Aluminium,Brass,Tinned Copper,Order Grade]", status: stated, evidence: ["WEB-TR-06"] }
        - { name: mesh_grade, type: "enum[Fine,Medium,Standard,기타]", status: stated, evidence: ["WEB-TR-05"] }
        - { name: form_process, type: "enum[crimping,pressing,spiralling,none]", status: stated, evidence: ["WEB-TR-05"] }
        - { name: application_category, type: "enum[airbag_filter,spacer_ring_air_gap_seal,silencer_muffler_packing,separation_ring,catalytic_converter_mesh_wrap,catalytic_converter_seal,exhaust_decoupling_ring_bellows_sleeve,anti_vibration_sound_heat_shield,engine_breather_oil_separator_filter_cap,knitted_mesh_roll,emi_shielding_gasket]", status: stated, evidence: ["WEB-TR-06", "PUB-TR-INTRO-KO#p7-9"] }
        - { name: wire_dia_mm, type: number, status: hypothesis }
        - { name: knit_width_mm, type: number, status: hypothesis }
        - { name: dims, type: json, status: hypothesis }
        - { name: special_char, type: boolean, status: hypothesis, note: "에어백 필터 등 특별특성 지정 여부(진단 C10)" }
        - { name: drawing_ref, type: link, sensitivity: L2, status: hypothesis }
    - { id: ProcessStep,      ui_label: "공정",       sensitivity: L1, seed_stated: ["편조", "Crimping 가공", "Pressing 가공", "Spiralling 가공"], evidence: ["WEB-TR-05"] }
    - { id: Equipment,        ui_label: "설비",       sensitivity: L1, note: "seed는 아래 equipment_public" }
    - { id: Tooling,          ui_label: "금형·지그",  sensitivity: L1, seed_stated: ["편조 금형"], evidence: ["PUB-TR-INTRO-KO#p10"] }
    - { id: SalesOrder,       ui_label: "수주",       sensitivity: L2 }
    - { id: Shipment,         ui_label: "출하·납품",  sensitivity: L1 }
    - { id: WorkOrder,        ui_label: "작업지시",   sensitivity: L1 }
    - { id: ProductionResult, ui_label: "생산 실적",  sensitivity: L1, note: "작업자 기록은 개인 평가에 쓰지 않음. 집계는 공정·설비 단위" }
    - { id: Lot,              ui_label: "LOT",        sensitivity: L1, note: "번호 규칙 TODO(진단 C8). 제안 규칙은 03 문서 5.8절" }
    - { id: Inspection,       ui_label: "검사",       sensitivity: L1 }
    - { id: Nonconformance,   ui_label: "부적합",     sensitivity: L1 }
    - { id: CustomerClaim,    ui_label: "고객 클레임", sensitivity: L2 }
    - { id: CorrectiveAction, ui_label: "시정조치(8D)", sensitivity: L2 }
    - { id: ChangeRequest4M,  ui_label: "4M 변경",    sensitivity: L2 }
    - { id: MaterialReceipt,  ui_label: "자재 입고",  sensitivity: L1 }
    - { id: RiskAssessment,   ui_label: "위험성평가", sensitivity: L1 }
    - { id: NearMissReport,   ui_label: "아차사고·개선 제안", sensitivity: L1 }
  equipment_public:                             # 공개 자료 두 가지가 다름 → 현재 값 TODO(진단 D1)
    - { kind: "편조 장치(Knitting Machine)", count_web: 36, count_intro_2016: 57, evidence: ["WEB-TR-05", "PUB-TR-INTRO-KO#p11"] }
    - { kind: "프레스 50ton", count_web: 1, count_intro_2016: 1, legal_inspection_candidate: true }
    - { kind: "프레스 20ton", count_web: 1, count_intro_2016: 1, legal_inspection_candidate: true }
    - { kind: "프레스 10ton", count_web: 3, count_intro_2016: 3, legal_inspection_candidate: true }
    - { kind: "전용기",       count_web: 4, count_intro_2016: 4 }
    - { kind: "롤링기",       count_web: 3, count_intro_2016: 3, note: "산안법 '롤러기' 해당 여부 TODO" }
    - { kind: "절단기",       count_web: 2, count_intro_2016: 2, note: "산안법 '전단기' 해당 여부 TODO" }
    - { kind: "스포트기",     count_web: null, count_intro_2016: 2 }
  links:
    - { from: Item, to: ProcessStep, type: routed_through, cardinality: "N:M" }
    - { from: WorkOrder, to: Lot, type: produces, cardinality: "1:N" }
    - { from: MaterialReceipt, to: Lot, type: creates_material_lot, cardinality: "1:N" }
    - { from: Lot, to: Lot, type: consumed_into, cardinality: "N:M", note: "LOT 역추적(원자재 → 편조 → 가공 → 출하)" }
    - { from: CustomerClaim, to: Lot, type: concerns, cardinality: "N:M" }
    - { from: CustomerClaim, to: CorrectiveAction, type: requires, cardinality: "1:N" }
    - { from: CorrectiveAction, to: ChangeRequest4M, type: may_trigger, cardinality: "1:N" }
  actions:                                      # 가설. 승인자는 decision_rights 확정 후 수정
    - { id: register_field_report, ui_label: "현장 등록", actors: [R_OPERATOR, R_PLANT_MGR, R_QA], approval: none, effects: ["유형별 담당 알림", "업무 생성 제안"] }
    - { id: dispose_nonconformance, ui_label: "부적합 처분", actors: [R_QA], approval: { required: true, approver: R_PLANT_MGR }, hypothesis: true }
    - { id: submit_8d, ui_label: "8D 제출", actors: [R_QA], approval: { required: true, approver: R_PLANT_MGR }, outputs: [DA_8D_REPORT], hypothesis: true }
    - { id: request_4m_change, ui_label: "4M 변경 신청", actors: [R_DEV, R_QA, R_PLANT_MGR], approval: { required: true, approver: R_CEO }, effects: ["고객 통보·승인 필요 여부 판단"], hypothesis: true }
    - { id: confirm_semiannual_review, ui_label: "반기 안전 점검 확인", actors: [R_CEO], approval: none, hypothesis: true, note: "중대재해처벌법 적용 시(상시 5명 이상)" }

# 레이어 L7. 프로세스·판단 규칙 — 모두 가설(업계 일반 흐름). 진단 인터뷰·문서로 확인
processes:
  - id: P_KNIT_TO_FORM
    name: "편조 → 가공"
    status: stated_partial
    steps_stated: ["편조(Fine/Medium/Standard mesh)", "가공(Crimping · Pressing · Spiralling)"]
    steps_hypothesis: ["원자재 입고·수입검사", "공정검사(초중종물)", "출하검사·포장", "출하"]
    evidence: ["WEB-TR-05", "PUB-TR-INTRO-KO#p10"]
    confidence: 0.5
  - id: P_CLAIM_TO_8D
    name: "고객 클레임 → 8D"
    status: hypothesis
    steps: ["클레임 접수", "대상 LOT 확인", "임시 조치(선별·출하 보류)", "근본 원인", "영구 대책(필요 시 4M)", "8D 제출", "수평전개"]
    sla: { containment_hours: null, report_8d_days: null, note: "고객 CSR 확인 TODO(진단 B7)" }
    confidence: 0.3
  - id: P_4M_CHANGE
    name: "4M 변경 → 고객 통보·승인"
    status: hypothesis
    steps: ["변경 제안", "영향 평가", "고객 통보·승인 요청", "초품 LOT 관리", "적용"]
    confidence: 0.3
  - id: P_FIELD_REPORT
